name: Deploy NGINX with Helm

on:
  push:
    branches:
      - main
    paths:
      - "charts/nginx-demo/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to local Kubernetes
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tools
        run: |
          kubectl version --client
          helm version

      - name: Check Kubernetes cluster
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Validate Helm chart
        run: |
          helm lint charts/nginx-demo
          helm template nginx-demo charts/nginx-demo

      - name: Deploy with Helm
        run: |
          helm upgrade --install nginx-demo charts/nginx-demo \
            --namespace helm-demo \
            --create-namespace \
            --wait \
            --timeout 120s

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/nginx-demo \
            --namespace helm-demo \
            --timeout=120s

          kubectl get pods,services --namespace helm-demo