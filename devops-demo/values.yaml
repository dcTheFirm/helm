
# Number of application replicas
replicaCount: 2

# Docker image
image:
  repository: devops-demo
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# Image pull secrets (not required for our local image)
imagePullSecrets: []

# Kubernetes naming overrides
nameOverride: ""
fullnameOverride: ""

# Service account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod metadata
podAnnotations: {}
podLabels: {}

# Pod security settings
podSecurityContext: {}

securityContext: {}

# Kubernetes Service
service:
  type: ClusterIP
  port: 8080

# Ingress is disabled; we'll use port-forward initially
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Application health checks
livenessProbe:
  httpGet:
    path: /health
    port: http

readinessProbe:
  httpGet:
    path: /health
    port: http

# Resource requests and limits
resources: {}

# Autoscaling is disabled for this local project
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Additional volumes
volumes: []

volumeMounts: []

# Node scheduling
nodeSelector: {}

tolerations: []

affinity: {}

# HTTPRoute is disabled
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []
